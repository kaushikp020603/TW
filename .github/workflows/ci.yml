name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install browser for end-to-end tests
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end tests (booking, readings, admin, SEO, PWA)
        run: node tests/run-all.mjs
      - name: Upload screenshots from the test run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/out
          if-no-files-found: ignore
